def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}

def annotationValue = { annotation, String key ->
    def values = annotation?.values ?: []
    for (int index = 0; index < values.size(); index += 2) {
        if (values[index] == key) {
            return values[index + 1]
        }
    }
    null
}

def verifyClientMixinSelectors = tasks.register("verifyClientMixinSelectors") {
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.file("libs/wathe-${project.wathe_version}.jar")
    inputs.file("libs/noellesroles-${project.noellesroles_version}.jar")
    inputs.file("src/client/resources/sparkwitch.client.mixins.json")

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def watheJar = file("libs/wathe-${project.wathe_version}.jar")
        def noellesRolesJar = file("libs/noellesroles-${project.noellesroles_version}.jar")
        def modZip = new java.util.zip.ZipFile(jarFile)
        def watheZip = new java.util.zip.ZipFile(watheJar)
        def noellesRolesZip = new java.util.zip.ZipFile(noellesRolesJar)
        // Source selectors are Yarn; this checks what remapJar actually ships against the intermediary provider jars.
        // 源码选择器为 Yarn；此处校验 remapJar 实际产出的选择器与 intermediary 提供方 jar 一致。
        def providerZips = [
                wathe: [zip: watheZip, label: "Wathe ${project.wathe_version}"],
                noellesroles: [zip: noellesRolesZip, label: "NoellesRoles ${project.noellesroles_version}"]
        ]
        try {
            def configEntry = modZip.getEntry("sparkwitch.client.mixins.json")
            if (configEntry == null) {
                throw new GradleException("Missing sparkwitch.client.mixins.json in ${jarFile.name}")
            }
            def config = new groovy.json.JsonSlurper().parse(modZip.getInputStream(configEntry))
            if (config.required != true) {
                throw new GradleException("Client mixin config must remain required in ${jarFile.name}")
            }
            if (config.injectors?.defaultRequire?.toString() != "1") {
                throw new GradleException(
                        "Client mixin defaultRequire drift: expected 1, found ${config.injectors?.defaultRequire}"
                )
            }
            def configuredMixins = config.client ?: []
            def providerNodes = [:]

            watheClientMixinContracts.each { contract ->
                if (!configuredMixins.contains(contract.configName)) {
                    throw new GradleException(
                            "Missing client mixin ${contract.configName} from sparkwitch.client.mixins.json"
                    )
                }

                def mixinNode = readClassNode(modZip, contract.mixinEntry)
                def handler = mixinNode.methods.find { it.name == contract.handler }
                if (handler == null) {
                    throw new GradleException("Missing handler ${contract.handler} in ${contract.mixinEntry}")
                }
                def annotations = []
                annotations.addAll(handler.visibleAnnotations ?: [])
                annotations.addAll(handler.invisibleAnnotations ?: [])
                def injection = annotations.find { it.desc == contract.annotationDesc }
                if (injection == null) {
                    throw new GradleException(
                            "Missing ${contract.annotationDesc} on ${contract.mixinEntry}#${contract.handler}"
                    )
                }
                def selectorValue = annotationValue(injection, "method")
                def selectors = selectorValue instanceof Collection
                        ? selectorValue.collect { it.toString() }
                        : [selectorValue?.toString()].findAll { it != null }
                if (selectors != [contract.selector]) {
                    throw new GradleException(
                            "Packaged selector drift for ${contract.mixinEntry}#${contract.handler}: "
                                    + "expected ${contract.selector}, found ${selectors}"
                    )
                }
                if (annotationValue(injection, "require")?.toString() == "0") {
                    throw new GradleException(
                            "Required client injection was weakened with require=0: "
                                    + "${contract.mixinEntry}#${contract.handler}"
                    )
                }

                if (contract.atTarget != null) {
                    def atValue = annotationValue(injection, "at")
                    def atAnnotations = atValue instanceof Collection ? atValue : [atValue]
                    def atTargets = atAnnotations.collect { annotationValue(it, "target") }
                            .findAll { it != null }
                            .collect { it.toString() }
                    if (atTargets != [contract.atTarget]) {
                        throw new GradleException(
                                "Packaged @At target drift for ${contract.mixinEntry}#${contract.handler}: "
                                        + "expected ${contract.atTarget}, found ${atTargets}"
                        )
                    }
                }

                def provider = providerZips[contract.provider ?: "wathe"]
                def providerNode = providerNodes.computeIfAbsent(contract.providerEntry) {
                    readClassNode(provider.zip, contract.providerEntry)
                }
                def providerMethod = providerNode.methods.find {
                    it.name == contract.providerMethod && it.desc == contract.providerDescriptor
                }
                if (providerMethod == null) {
                    throw new GradleException(
                            "${provider.label} is missing ${contract.providerEntry}#"
                                    + "${contract.providerMethod}${contract.providerDescriptor}"
                    )
                }
            }
        } finally {
            noellesRolesZip.close()
            watheZip.close()
            modZip.close()
        }
    }
}

tasks.register("verifyCompatibilityBaselines") {
    inputs.file("gradle.properties")
    inputs.file("src/main/resources/fabric.mod.json")
    inputs.files(compatibilityBaselines.collect { modId, baseline ->
        file("libs/${modId}-${baseline.version}.jar")
    })
    inputs.files(compatibilityProviderFiles)

    doLast {
        if (project.mod_version.toString() != compatibilityReleaseVersion) {
            throw new GradleException(
                    "Compatibility release drift: expected ${compatibilityReleaseVersion}, found ${project.mod_version}"
            )
        }

        def expectedProviderNames = compatibilityBaselines.collect { modId, baseline ->
            "${modId}-${baseline.version}.jar"
        }.sort()
        def actualProviderNames = compatibilityProviderFiles.files.collect { it.name }.sort()
        if (actualProviderNames != expectedProviderNames) {
            throw new GradleException(
                    "Provider jar set drift: expected ${expectedProviderNames}, found ${actualProviderNames}"
            )
        }

        compatibilityBaselines.each { modId, baseline ->
            def actualVersion = project.property(baseline.property).toString()
            if (actualVersion != baseline.version) {
                throw new GradleException(
                        "Provider baseline drift for ${modId}: expected ${baseline.version}, found ${actualVersion}"
                )
            }

            def providerJar = file("libs/${modId}-${baseline.version}.jar")
            if (!providerJar.isFile()) {
                throw new GradleException("Missing provider baseline jar: ${providerJar}")
            }
            def actualHash = sha256(providerJar)
            if (actualHash != baseline.sha256) {
                throw new GradleException(
                        "Provider baseline checksum drift for ${providerJar.name}: expected ${baseline.sha256}, found ${actualHash}"
                )
            }

            def providerZip = new java.util.zip.ZipFile(providerJar)
            try {
                def metadataEntry = providerZip.getEntry("fabric.mod.json")
                if (metadataEntry == null) {
                    throw new GradleException("Missing fabric.mod.json in ${providerJar.name}")
                }
                def providerMetadata = new groovy.json.JsonSlurper().parse(providerZip.getInputStream(metadataEntry))
                if (providerMetadata.id?.toString() != modId) {
                    throw new GradleException(
                            "Provider id drift in ${providerJar.name}: expected ${modId}, found ${providerMetadata.id}"
                    )
                }
                if (providerMetadata.version?.toString() != baseline.version) {
                    throw new GradleException(
                            "Provider metadata version drift in ${providerJar.name}: expected ${baseline.version}, found ${providerMetadata.version}"
                    )
                }
                baseline.depends.each { dependencyId, expectedPredicate ->
                    def actualPredicate = providerMetadata.depends?.get(dependencyId)?.toString()
                    if (actualPredicate != expectedPredicate) {
                        throw new GradleException(
                                "Provider dependency drift in ${providerJar.name}: ${dependencyId} expected ${expectedPredicate}, found ${actualPredicate}"
                        )
                    }
                }
            } finally {
                providerZip.close()
            }
        }

        def metadata = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))
        if (metadata.version?.toString() != '${version}') {
            throw new GradleException(
                    "Source metadata version placeholder drift: expected \${version}, found ${metadata.version}"
            )
        }
        [
                wathe: '${wathe_version}',
                noellesroles: '${noellesroles_version}',
                sparkfactionapi: '>=${sparkfactionapi_version}'
        ].each { modId, expectedPredicate ->
            def actualPredicate = metadata.depends?.get(modId)?.toString()
            if (actualPredicate != expectedPredicate) {
                throw new GradleException(
                        "Source metadata dependency drift for ${modId}: expected ${expectedPredicate}, found ${actualPredicate}"
                )
            }
        }

        def expectedSuggests = ">=${sparkTraitsCompatibilityFloor}"
        def expectedBreaks = "<${sparkTraitsCompatibilityFloor}"
        if (metadata.suggests?.sparktraits?.toString() != expectedSuggests) {
            throw new GradleException(
                    "SparkTraits suggested floor drift: expected ${expectedSuggests}, found ${metadata.suggests?.sparktraits}"
            )
        }
        if (metadata.breaks?.sparktraits?.toString() != expectedBreaks) {
            throw new GradleException(
                    "SparkTraits break floor drift: expected ${expectedBreaks}, found ${metadata.breaks?.sparktraits}"
            )
        }
    }
}

// Compare Spark-style numeric versions used by SparkFactionAPI dependency floors.
// 比较 SparkFactionAPI 依赖下限使用的 Spark 数字版本。
def versionAtLeast = { String actualVersion, String minimumVersion ->
    def parse = { String version ->
        version.tokenize(".").collect { part ->
            part ==~ /\d+/ ? part.toInteger() : 0
        }
    }
    def actualParts = parse(actualVersion)
    def minimumParts = parse(minimumVersion)
    def length = Math.max(actualParts.size(), minimumParts.size())
    for (int index = 0; index < length; index++) {
        def actualPart = index < actualParts.size() ? actualParts[index] : 0
        def minimumPart = index < minimumParts.size() ? minimumParts[index] : 0
        if (actualPart != minimumPart) {
            return actualPart > minimumPart
        }
    }
    return true
}

tasks.register("verifyModJarVersion") {
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def archiveName = remappedModJar.get().archiveBaseName.get()
        def suffix = ".jar"
        if (!jarFile.name.startsWith("${archiveName}-") || !jarFile.name.endsWith(suffix)) {
            throw new GradleException("Cannot read version from jar filename: ${jarFile.name}")
        }

        // Keep the loader-visible mod version tied to the shipped jar filename.
        // 将加载器可见版本绑定到发布 jar 文件名，避免软件里显示旧版本。
        def jarVersion = jarFile.name.substring(archiveName.length() + 1, jarFile.name.length() - suffix.length())
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zipFile.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(entry))
            def metadataVersion = metadata.version?.toString()
            if (metadataVersion != jarVersion) {
                throw new GradleException("Jar version mismatch: ${jarFile.name} says ${jarVersion}, but fabric.mod.json says ${metadataVersion}")
            }

            def clientEntrypoint = "dev.caecorthus.sparkwitch.client.SparkWitchClient"
            def clientEntrypoints = metadata.entrypoints?.client ?: []
            if (!clientEntrypoints.contains(clientEntrypoint)) {
                throw new GradleException("Missing client entrypoint ${clientEntrypoint} in ${jarFile.name}")
            }

            def voicechatEntrypoint = "dev.caecorthus.sparkwitch.voice.SparkWitchVoiceChatPlugin"
            def voicechatEntrypoints = metadata.entrypoints?.voicechat ?: []
            if (!voicechatEntrypoints.contains(voicechatEntrypoint)) {
                throw new GradleException("Missing voicechat entrypoint ${voicechatEntrypoint} in ${jarFile.name}")
            }

            [
                    "wathe"           : project.wathe_version,
                    "ratatouille"     : project.ratatouille_version,
                    "noellesroles"    : project.noellesroles_version,
                    "sparkfactionapi" : ">=${project.sparkfactionapi_version}"
            ].each { modId, versionPredicate ->
                def actualPredicate = metadata.depends?.get(modId)?.toString()
                if (actualPredicate != versionPredicate) {
                    throw new GradleException("Dependency ${modId} mismatch in ${jarFile.name}: expected ${versionPredicate}, found ${actualPredicate}")
                }
            }

            def expectedSparkTraitsSuggests = ">=${sparkTraitsCompatibilityFloor}"
            def expectedSparkTraitsBreaks = "<${sparkTraitsCompatibilityFloor}"
            if (metadata.suggests?.sparktraits?.toString() != expectedSparkTraitsSuggests) {
                throw new GradleException(
                        "SparkTraits suggestion mismatch in ${jarFile.name}: expected ${expectedSparkTraitsSuggests}, found ${metadata.suggests?.sparktraits}"
                )
            }
            if (metadata.breaks?.sparktraits?.toString() != expectedSparkTraitsBreaks) {
                throw new GradleException(
                        "SparkTraits break mismatch in ${jarFile.name}: expected ${expectedSparkTraitsBreaks}, found ${metadata.breaks?.sparktraits}"
                )
            }

            def dependencyJar = file("libs/sparkfactionapi-${project.sparkfactionapi_version}.jar")
            if (!dependencyJar.isFile()) {
                throw new GradleException("Missing bundled SparkFactionAPI jar: ${dependencyJar}")
            }
            def dependencyZip = new java.util.zip.ZipFile(dependencyJar)
            try {
                def dependencyEntry = dependencyZip.getEntry("fabric.mod.json")
                if (dependencyEntry == null) {
                    throw new GradleException("Missing fabric.mod.json in ${dependencyJar.name}")
                }
                def dependencyMetadata = new groovy.json.JsonSlurper().parse(dependencyZip.getInputStream(dependencyEntry))
                def dependencyVersion = dependencyMetadata.version?.toString()
                if (!versionAtLeast(dependencyVersion, project.sparkfactionapi_version.toString())) {
                    throw new GradleException("Bundled SparkFactionAPI ${dependencyVersion} is below required ${project.sparkfactionapi_version}")
                }
            } finally {
                dependencyZip.close()
            }

            [
                    "dev/caecorthus/sparkwitch/client/SparkWitchClient.class",
                    "dev/caecorthus/sparkwitch/net/SparkWitchServerConnection.class",
                    "dev/caecorthus/sparkwitch/net/SparkWitchPackets.class",
                    "dev/caecorthus/sparkwitch/net/SparkWitchServerConfirmS2CPacket.class",
                    "dev/caecorthus/sparkwitch/client/net/version/SparkWitchClientVersionHandshake.class"
            ].each { requiredEntry ->
                // Client display gates need both login and play-stage Spark server confirmation.
                // 客户端显示开关需要登录阶段和 play 阶段的 Spark 服务端确认。
                if (zipFile.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing required client confirmation class ${requiredEntry} in ${jarFile.name}")
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

// Black Raven acting overlay drift guard. The overlay widens GameWorldComponent#isRole(UUID, Role) for the
// allowed disguise roles, so every allowed-role gate in the pinned Wathe/NoellesRoles jars must be classified in
// src/test/resources/blackraven/acting_role_seams.txt, and no isRole call may take a non-constant role.
// 黑羽鸦扮演覆盖层漂移守卫：覆盖层会为可伪装职业放宽 GameWorldComponent#isRole(UUID, Role)，因此固定版本
// Wathe/NoellesRoles jar 中每个可伪装职业判定点都必须在 acting_role_seams.txt 中归类，且任何 isRole 调用都不得使用非常量职业。
def blackRavenRoleDescriptor = "Ldev/doctor4t/wathe/api/Role;"
def blackRavenIdentifierDescriptor = "Lnet/minecraft/class_2960;"
def blackRavenGameWorldOwner = "dev/doctor4t/wathe/cca/GameWorldComponent"
// Allowed NoellesRoles role constants (the SparkWitch-owned allowed roles are not in the provider jars).
// Each *_ID twin is checked too; the mapping itself is re-proven from Noellesroles.<clinit>.
// 可伪装的 NoellesRoles 职业常量（SparkWitch 自有的可伪装职业不在提供方 jar 中）；同名 *_ID 常量一并检查，
// 映射关系本身会从 Noellesroles.<clinit> 重新验证。
def blackRavenActingRoleFields = [
        "org/agmas/noellesroles/Noellesroles.CONDUCTOR"      : "noellesroles:conductor",
        "org/agmas/noellesroles/Noellesroles.ATTENDANT"      : "noellesroles:attendant",
        "org/agmas/noellesroles/Noellesroles.AWESOME_BINGLUS": "noellesroles:awesome_binglus",
        "org/agmas/noellesroles/Noellesroles.MERMAID"        : "noellesroles:mermaid",
        "org/agmas/noellesroles/Noellesroles.TIMEKEEPER"     : "noellesroles:time_keeper",
        "org/agmas/noellesroles/Noellesroles.WAITER"         : "noellesroles:waiter",
        "org/agmas/noellesroles/Noellesroles.REPORTER"       : "noellesroles:reporter",
        "org/agmas/noellesroles/Noellesroles.BARTENDER"      : "noellesroles:bartender",
        "org/agmas/noellesroles/Noellesroles.RECALLER"       : "noellesroles:recaller",
        "org/agmas/noellesroles/Noellesroles.NOISEMAKER"     : "noellesroles:noisemaker",
        "org/agmas/noellesroles/Noellesroles.SPIRIT_WALKER"  : "noellesroles:spiritualist",
        "org/agmas/noellesroles/Noellesroles.TOXICOLOGIST"   : "noellesroles:toxicologist",
        "org/agmas/noellesroles/Noellesroles.ENGINEER"       : "noellesroles:engineer",
        "org/agmas/noellesroles/Noellesroles.DETECTIVE"      : "noellesroles:detective",
        "org/agmas/noellesroles/Noellesroles.PROFESSOR"      : "noellesroles:professor"
]
// isRole sites are reached by the overlay; every other kind stays raw and is a gap an adapter must cover.
// isRole 调用点由覆盖层覆盖；其他类型均保持真实判定，属于必须由适配器补齐的缺口。
def blackRavenOverlayTags = ["SELF", "RECIPIENT", "LOCAL", "DEATH", "BEFORE", "TARGET_SERVER_ONLY"]
def blackRavenGapTags = ["GAP_KIT", "GAP_TASK_MONEY", "GAP_DOOR_NOTICE"]
def blackRavenSeamKinds = ["isRole", "getAllWithRole", "equals", "idEquals", "acmp"]

def verifyBlackRavenActingRoleSeams = tasks.register("verifyBlackRavenActingRoleSeams") {
    def seamsFile = file("src/test/resources/blackraven/acting_role_seams.txt")
    inputs.file("libs/wathe-${project.wathe_version}.jar")
    inputs.file("libs/noellesroles-${project.noellesroles_version}.jar")
    inputs.file(seamsFile)

    doLast {
        if (!seamsFile.isFile()) {
            throw new GradleException("Missing Black Raven acting-role seam list: ${seamsFile}")
        }
        def watheZip = new java.util.zip.ZipFile(file("libs/wathe-${project.wathe_version}.jar"))
        def noellesRolesZip = new java.util.zip.ZipFile(file("libs/noellesroles-${project.noellesroles_version}.jar"))
        try {
            // 1. Re-prove field -> role id from Noellesroles.<clinit>: `ID = Identifier.of(MOD_ID, "<path>")`
            //    and `ROLE = ...(ID, ...)`, with exactly one *_ID read between two Role stores.
            // 1. 从 Noellesroles.<clinit> 重新验证字段与职业 id 的映射。
            def fieldIds = [:]
            def ownerNodes = [:]
            blackRavenActingRoleFields.each { key, roleId ->
                def separator = key.lastIndexOf(".")
                def owner = key.substring(0, separator)
                def name = key.substring(separator + 1)
                def path = roleId.substring(roleId.indexOf(":") + 1)
                def node = ownerNodes.computeIfAbsent(owner) { readClassNode(noellesRolesZip, "${owner}.class") }
                if (!node.fields.any { it.name == name && it.desc == blackRavenRoleDescriptor }) {
                    throw new GradleException("NoellesRoles is missing Role field ${key}")
                }
                if (!node.fields.any { it.name == "${name}_ID" && it.desc == blackRavenIdentifierDescriptor }) {
                    throw new GradleException("NoellesRoles is missing Identifier field ${key}_ID")
                }
                def clinit = node.methods.find { it.name == "<clinit>" }
                if (clinit == null) {
                    throw new GradleException("Missing <clinit> in ${owner}")
                }
                def insns = clinit.instructions.toArray().findAll { it.opcode >= 0 }
                def idStores = insns.findIndexValues {
                    it.opcode == org.objectweb.asm.Opcodes.PUTSTATIC && it.owner == owner && it.name == "${name}_ID"
                }
                def roleStores = insns.findIndexValues {
                    it.opcode == org.objectweb.asm.Opcodes.PUTSTATIC && it.owner == owner && it.name == name
                }
                if (idStores.size() != 1 || roleStores.size() != 1) {
                    throw new GradleException("${key} must be stored exactly once in <clinit> (id ${idStores.size()}, role ${roleStores.size()})")
                }
                def ldc = insns.subList(0, idStores[0] as int).reverse().find {
                    it instanceof org.objectweb.asm.tree.LdcInsnNode && it.cst instanceof String
                }
                if (ldc?.cst != path) {
                    throw new GradleException("${key}_ID is built from '${ldc?.cst}', expected '${path}' (${roleId})")
                }
                int roleStore = roleStores[0] as int
                int previousRoleStore = -1
                for (int index = roleStore - 1; index >= 0; index--) {
                    def candidate = insns[index]
                    if (candidate.opcode == org.objectweb.asm.Opcodes.PUTSTATIC && candidate.desc == blackRavenRoleDescriptor) {
                        previousRoleStore = index
                        break
                    }
                }
                def idReads = insns.subList(previousRoleStore + 1, roleStore).findAll {
                    it.opcode == org.objectweb.asm.Opcodes.GETSTATIC && it.owner == owner
                            && it.desc == blackRavenIdentifierDescriptor && it.name.endsWith("_ID")
                }.collect { it.name }
                if (idReads != ["${name}_ID".toString()]) {
                    throw new GradleException("${key} is constructed from ${idReads}, expected [${name}_ID]")
                }
                fieldIds[key] = [id: roleId, desc: blackRavenRoleDescriptor]
                fieldIds["${key}_ID".toString()] = [id: roleId, desc: blackRavenIdentifierDescriptor]
            }

            // 2. Scan every method of both jars with a source-tracking analyzer, so both operand orders and any
            //    intervening instruction are handled.
            // 2. 使用可追踪来源的分析器扫描两个 jar 的每个方法，因此能处理两种操作数顺序以及中间插入的指令。
            def allowedSource = { value ->
                if (value == null || value.insns.size() != 1) {
                    return null
                }
                def source = value.insns.iterator().next()
                if (source.opcode != org.objectweb.asm.Opcodes.GETSTATIC) {
                    return null
                }
                def field = fieldIds["${source.owner}.${source.name}".toString()]
                field != null && field.desc == source.desc ? field : null
            }
            def isEqualsInvoke = { insn ->
                insn instanceof org.objectweb.asm.tree.MethodInsnNode && (
                        (insn.opcode != org.objectweb.asm.Opcodes.INVOKESTATIC
                                && insn.name == "equals" && insn.desc == "(Ljava/lang/Object;)Z")
                        || (insn.opcode == org.objectweb.asm.Opcodes.INVOKESTATIC && insn.owner == "java/util/Objects"
                                && insn.name == "equals" && insn.desc == "(Ljava/lang/Object;Ljava/lang/Object;)Z"))
            }
            def isAcmp = { insn ->
                insn.opcode == org.objectweb.asm.Opcodes.IF_ACMPEQ || insn.opcode == org.objectweb.asm.Opcodes.IF_ACMPNE
            }
            def isGameWorldInvoke = { insn, String name ->
                insn instanceof org.objectweb.asm.tree.MethodInsnNode && insn.owner == blackRavenGameWorldOwner && insn.name == name
            }
            def found = new TreeMap()
            def dynamicIsRole = new TreeSet()
            [watheZip, noellesRolesZip].each { archive ->
                archive.entries().findAll { it.name.endsWith(".class") }.each { entry ->
                    def node = readClassNode(archive, entry.name)
                    node.methods.each { method ->
                        def insns = method.instructions.toArray()
                        boolean hasIsRole = insns.any { isGameWorldInvoke(it, "isRole") }
                        boolean hasAllowedRead = insns.any {
                            it.opcode == org.objectweb.asm.Opcodes.GETSTATIC
                                    && fieldIds.containsKey("${it.owner}.${it.name}".toString())
                        }
                        if (!hasIsRole && !hasAllowedRead) {
                            return
                        }
                        def frames
                        try {
                            frames = new org.objectweb.asm.tree.analysis.Analyzer(
                                    new org.objectweb.asm.tree.analysis.SourceInterpreter()
                            ).analyze(node.name, method)
                        } catch (Exception exception) {
                            throw new GradleException("Cannot analyze ${node.name}#${method.name}${method.desc}: ${exception.message}")
                        }
                        def site = "${node.name}#${method.name}".toString()
                        def record = { String kind, field ->
                            def key = "${kind} ${field.id} ${site}".toString()
                            found[key] = (found[key] ?: 0) + 1
                        }
                        insns.eachWithIndex { insn, index ->
                            def frame = frames[index]
                            if (frame == null) {
                                return
                            }
                            int top = frame.getStackSize() - 1
                            if (isGameWorldInvoke(insn, "isRole")) {
                                def roleValue = frame.getStack(top)
                                def source = roleValue.insns.size() == 1 ? roleValue.insns.iterator().next() : null
                                def previous = insn.previous
                                while (previous != null && previous.opcode < 0) {
                                    previous = previous.previous
                                }
                                boolean constantRole = source != null && source.is(previous)
                                        && source.opcode == org.objectweb.asm.Opcodes.GETSTATIC
                                        && source.desc == blackRavenRoleDescriptor
                                // Wathe's own isRole(PlayerEntity, Role) -> isRole(UUID, Role) delegation is the
                                // wrapped callee itself. / Wathe 自身的重载委托就是被包装的被调用方。
                                boolean overloadDelegation = node.name == blackRavenGameWorldOwner
                                        && method.name == "isRole"
                                        && method.desc == "(Lnet/minecraft/class_1657;${blackRavenRoleDescriptor})Z"
                                        && insn.desc == "(Ljava/util/UUID;${blackRavenRoleDescriptor})Z"
                                if (!constantRole && !overloadDelegation) {
                                    dynamicIsRole << "${site}${method.desc}".toString()
                                }
                                def field = allowedSource(roleValue)
                                if (field != null) {
                                    record("isRole", field)
                                }
                            } else if (isGameWorldInvoke(insn, "getAllWithRole")) {
                                def field = allowedSource(frame.getStack(top))
                                if (field != null) {
                                    record("getAllWithRole", field)
                                }
                            } else if (isEqualsInvoke(insn) || isAcmp(insn)) {
                                [frame.getStack(top - 1), frame.getStack(top)].each { operand ->
                                    def field = allowedSource(operand)
                                    if (field != null) {
                                        def kind = isAcmp(insn) ? "acmp"
                                                : (field.desc == blackRavenRoleDescriptor ? "equals" : "idEquals")
                                        record(kind, field)
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // 3. Compare against the checked-in classification. / 3. 与已提交的分类清单比对。
            def expected = [:]
            def problems = []
            def allowedIds = blackRavenActingRoleFields.values() as Set
            seamsFile.readLines("UTF-8").eachWithIndex { rawLine, lineIndex ->
                def line = rawLine.trim()
                if (line.isEmpty() || line.startsWith("#")) {
                    return
                }
                def columns = line.split(/\s+/)
                def where = "${seamsFile.name}:${lineIndex + 1}"
                if (columns.length != 5) {
                    problems << "${where}: expected '<TAG> <kind> <role> <owner#method> <count>', found '${line}'"
                    return
                }
                def (tag, kind, roleId, site, count) = columns.toList()
                if (!(kind in blackRavenSeamKinds)) {
                    problems << "${where}: unknown kind ${kind}"
                }
                def validTags = kind == "isRole" ? blackRavenOverlayTags : blackRavenGapTags
                if (!(tag in validTags)) {
                    problems << "${where}: tag ${tag} is not valid for ${kind} (expected one of ${validTags})"
                }
                if (!(roleId in allowedIds)) {
                    problems << "${where}: ${roleId} is not an audited allowed role"
                }
                if (!(count ==~ /[1-9][0-9]*/)) {
                    problems << "${where}: count must be a positive integer, found ${count}"
                }
                def key = "${kind} ${roleId} ${site}".toString()
                if (expected.containsKey(key)) {
                    problems << "${where}: duplicate entry ${key}"
                }
                expected[key] = count ==~ /[1-9][0-9]*/ ? (count as int) : -1
            }
            found.each { key, count ->
                if (!expected.containsKey(key)) {
                    problems << "Unclassified acting-role seam (add '<TAG> ${key} ${count}'): ${key}"
                } else if (expected[key] != count) {
                    problems << "Seam count drift for ${key}: listed ${expected[key]}, found ${count}"
                }
            }
            expected.keySet().findAll { !found.containsKey(it) }.each { key ->
                problems << "Listed acting-role seam no longer exists: ${key}"
            }
            dynamicIsRole.each { site ->
                problems << "isRole with a non-constant role operand (the overlay cannot be audited there): ${site}"
            }
            if (!problems.isEmpty()) {
                throw new GradleException("Black Raven acting-role seam drift:\n  " + problems.join("\n  "))
            }
            logger.lifecycle("Black Raven acting-role seams verified: ${found.size()} classified sites, no dynamic isRole.")
        } finally {
            noellesRolesZip.close()
            watheZip.close()
        }
    }
}

def requiredArchitectureDocs = [
        "AGENTS.md",
        "CONTEXT.md",
        "DOWNSTREAM_MIGRATION_NOTES.md"
]
def requiredArchitectureSources = [
        "src/main/java/dev/caecorthus/sparkwitch/api/SparkWitchApi.java",
        "src/main/java/dev/caecorthus/sparkwitch/api/WitchManaApi.java",
        "src/main/java/dev/caecorthus/sparkwitch/roles/civilian/apprentice/ApprenticeInstinctRules.java",
        "src/main/java/dev/caecorthus/sparkwitch/roles/civilian/apprentice/abilities/ApprenticeAbilityRuntime.java",
        "src/main/java/dev/caecorthus/sparkwitch/roles/civilian/piggod/PigGodChaseRuntime.java",
        "src/main/java/dev/caecorthus/sparkwitch/roles/witch/grandwitch/GrandWitchRules.java",
        "src/main/java/dev/caecorthus/sparkwitch/roles/witch/grandwitch/GrandWitchWorldRuntime.java",
        "src/test/java/dev/caecorthus/sparkwitch/api/SparkWitchApiTest.java",
        "src/test/java/dev/caecorthus/sparkwitch/api/WitchManaApiTest.java",
        "src/test/java/dev/caecorthus/sparkwitch/roles/civilian/apprentice/abilities/ApprenticeAbilityWindowRulesTest.java",
        "src/test/java/dev/caecorthus/sparkwitch/roles/witch/grandwitch/GrandWitchRulesTest.java"
]

tasks.register("verifyArchitecture") {
    dependsOn verifyBlackRavenActingRoleSeams
    inputs.files(requiredArchitectureDocs.collect { file(it) })
    inputs.files(requiredArchitectureSources.collect { file(it) })
    inputs.files(fileTree("src/main/java") { include "**/*.java" })
    inputs.files(fileTree("src/client/java") { include "**/*.java" })

    doLast {
        (requiredArchitectureDocs + requiredArchitectureSources).each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing required architecture contract file: ${path}")
            }
        }

        // Optional SparkTraits integration may reflect its public facade, never internal implementation packages.
        // 可选 SparkTraits 集成只能反射公共门面，不能反射内部实现包。
        def forbiddenSparkTraitsTargets = [
                "dev.caecorthus.sparktraits.impl",
                "dev.caecorthus.sparktraits.component"
        ]
        [fileTree("src/main/java"), fileTree("src/client/java")].each { sourceTree ->
            sourceTree.matching { include "**/*.java" }.files.each { sourceFile ->
                def sourceText = sourceFile.getText("UTF-8")
                forbiddenSparkTraitsTargets.each { target ->
                    if (sourceText.contains(target)) {
                        throw new GradleException(
                                "Forbidden SparkTraits internal target '${target}' in ${sourceFile}"
                        )
                    }
                }
            }
        }
    }
}

